apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lmsc-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: mohamed.code81.lms
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lmsc-service
                port:
                  number: 8080
